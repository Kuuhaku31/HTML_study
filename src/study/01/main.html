<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JavaScript</title>
    <script>
      function reset() {
        x = document.getElementById("demo");
        x.innerHTML = "这是一个段落";
      }

      function displayDate() {
        x = document.getElementById("demo");
        x.innerHTML = Date();
      }

      function showText() {
        x = document.getElementById("demo"); // 找到元素
        x.innerHTML = "Hello JavaScript!"; // 改变内容
      }
    </script>
    <script>
      function ChangeImage() {
        element = document.getElementById("myimage");

        // 判断图片是否亮着
        if (element.src.match("0002")) {
          element.src = "../../../mat/imgs/0001.png";
        } else {
          element.src = "../../../mat/imgs/0002.png";
        }
      }
    </script>
  </head>

  <body>
    <h1>我的第一个 JavaScript 程序</h1>
    <p id="demo">这是一个段落</p>

    <button type="button" onclick="displayDate()">显示日期</button>
    <button type="button" onclick="showText()">显示文本</button>
    <button type="button" onclick="reset()">重置</button>
    <p>点击下面的图片：</p>
    <img
      id="myimage"
      onclick="ChangeImage()"
      src="../../../mat/imgs/0001.png"
      width="300"
      height="300"
    />
  </body>
</html>
